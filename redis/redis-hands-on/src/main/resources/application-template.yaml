spring:
  application:
    name: redis-hands-on

  #Datasource
  datasource:
    url: jdbc:mysql://localhost:3306/redis_hands_on
    username: your_username
    password: your_password

  #Hibernate
  jpa:
    hibernate.ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true